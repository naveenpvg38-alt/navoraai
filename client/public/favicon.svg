<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shield-rim" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#818CF8" />
      <stop offset="100%" stopColor="#C084FC" />
    </linearGradient>
    <linearGradient id="shield-bg" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#131D36" />
      <stop offset="100%" stopColor="#0B1120" />
    </linearGradient>
    <linearGradient id="n-left" x1="20" y1="18" x2="25" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
    <linearGradient id="n-diag" x1="22" y1="18" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#67E8F9" />
      <stop offset="45%" stopColor="#38BDF8" />
      <stop offset="85%" stopColor="#818CF8" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>
    <linearGradient id="n-right" x1="39" y1="18" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#C084FC" />
      <stop offset="100%" stopColor="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Shield Base -->
  <polygon
    points="32,6 54,18.5 54,45.5 32,58 10,45.5 10,18.5"
    fill="url(#shield-bg)"
    stroke="url(#shield-rim)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Inner Circuit Inset -->
  <polygon
    points="32,10.5 49.5,20.5 49.5,43.5 32,53.5 14.5,43.5 14.5,20.5"
    fill="none"
    stroke="#38BDF8"
    stroke-opacity="0.25"
    stroke-width="1"
    stroke-dasharray="3 2"
    stroke-linejoin="round"
  />

  <!-- 'N' Left Pillar -->
  <path d="M 20 21 L 25 18 L 25 43 L 20 46 Z" fill="url(#n-left)" />

  <!-- 'N' Right Pillar -->
  <path d="M 39 18 L 44 21 L 44 46 L 39 43 Z" fill="url(#n-right)" />

  <!-- 'N' Diagonal Slash -->
  <path d="M 20.5 20.5 L 26 18 L 43.5 43.5 L 38 46 Z" fill="url(#n-diag)" />

  <!-- Route Nodes -->
  <circle cx="20.5" cy="20.5" r="2" fill="#FFFFFF" />
  <circle cx="43.5" cy="43.5" r="2" fill="#FFFFFF" />
  <polygon points="32,29.5 34.5,32 32,34.5 29.5,32" fill="#FFFFFF" />
</svg>