<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#151D30"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)"/>

  <!-- Outer Celestial Orbiting Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-dasharray="16 12" stroke-opacity="0.65"/>

  <!-- Inner Compass Track -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.2"/>

  <!-- Compass Cardinal Markers -->
  <line x1="256" y1="90" x2="256" y2="125" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="387" x2="256" y2="422" stroke="#818CF8" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="256" x2="125" y2="256" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <line x1="387" y1="256" x2="422" y2="256" stroke="#818CF8" stroke-width="6" stroke-linecap="round"/>

  <!-- North Needle (Cyan) -->
  <polygon points="256,130 290,256 256,236 222,256" fill="#38BDF8"/>
  
  <!-- South Needle (Violet) -->
  <polygon points="256,382 290,256 256,276 222,256" fill="#818CF8" opacity="0.85"/>

  <!-- Central Pivot Core -->
  <circle cx="256" cy="256" r="30" fill="#0B1120" stroke="url(#ringGrad)" stroke-width="5"/>
  <circle cx="256" cy="256" r="14" fill="#FFFFFF"/>

  <!-- Orbiting Star Particles -->
  <circle cx="160" cy="170" r="8" fill="#38BDF8"/>
  <circle cx="350" cy="340" r="6" fill="#C084FC"/>
  <circle cx="360" cy="180" r="5" fill="#38BDF8" opacity="0.7"/>
</svg>
